<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>H Projet</title>
  <style>
    :root {
      --b: #0b3b8c;
      --a: #1d6fe0;
      --g: #14b8a6;
      --bg: #eef3fb;
      --card: #ffffff;
      --text: #10213a;
      --muted: #566a87;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #edf5ff 0%, #eef3fb 100%);
      color: var(--text);
    }
    .card {
      width: min(520px, 92vw);
      background: var(--card);
      border-radius: 22px;
      box-shadow: 0 20px 45px rgba(11, 59, 140, 0.14);
      padding: 32px 28px;
      text-align: center;
      border: 1px solid #dfe7f5;
    }
    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0b3b8c, #1d6fe0);
      border-radius: 22px;
      color: white;
      font-size: 34px;
      font-weight: 700;
      box-shadow: 0 12px 24px rgba(29, 111, 224, 0.3);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 2.7rem);
      color: var(--b);
    }
    p {
      margin: 12px 0 24px;
      color: var(--muted);
      font-size: 1rem;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--a), #1554c7);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      padding: 12px 26px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(29, 111, 224, 0.25);
    }
    .meta {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">H</div>
    <h1>H Projet</h1>
    <p>Gestion de projet, suivi des tâches, planning, équipe et rapports.</p>
    <a class="btn" href="./H_Projet.html">Ouvrir le projet</a>
    <div class="meta">GitHub Pages · version de démonstration</div>
  </div>
</body>
</html>
